name: Scan weekend tee times

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (off the hour; GitHub may delay runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: write             # lets the job commit REPORT.md / state.json back

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and alert
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m teewatch.main

      - name: Save report and alert history
        if: always()
        run: |
          git config user.name "tee-time-bot"
          git config user.email "tee-time-bot@users.noreply.github.com"
          git add REPORT.md latest.json state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Scan $(TZ=America/Los_Angeles date '+%a %b %-d %-I:%M %p')"
            git pull --rebase --autostash && git push
          fi
